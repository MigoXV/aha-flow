name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev qt6-multimedia-dev qt6-websockets-dev qt6-svg-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test without the LAN engine
        run: ctest --preset release
      - name: Package
        working-directory: build/release
        run: cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: aha-flow-linux-x64
          path: build/release/aha-flow-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          # Qt SVG is included in the desktop base archives, not an optional aqt module.
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build/windows --config Release --parallel 2
      - name: Test without the LAN engine
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Check native Windows fonts and DPI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_LOGGING_RULES = 'qt.qpa.fonts.debug=true'
          foreach ($scale in @('1', '1.25', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $directory = Join-Path $env:GITHUB_WORKSPACE "build/windows/ui-screenshots/$scale"
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $env:AHA_FLOW_SCREENSHOT_DIR = $directory
            & ./build/windows/tests/Release/aha_ui_tests.exe fontsSurviveStylingAndDpi compactSettingsAndTranscript -o "$directory/test-results.txt,txt" 2> "$directory/font-engine.log"
            if ($LASTEXITCODE -ne 0) {
              Get-Content "$directory/test-results.txt"
              throw "Native Windows UI check failed at scale $scale"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aha-flow-windows-ui-checks
          path: build/windows/ui-screenshots/
          if-no-files-found: warn
      - name: Package with Qt runtime
        working-directory: build/windows
        run: cpack -C Release -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: aha-flow-windows-x64
          path: build/windows/aha-flow-*.zip
          if-no-files-found: error
