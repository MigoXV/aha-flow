name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev qt6-multimedia-dev qt6-websockets-dev qt6-svg-dev qt6-wayland libssl-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Configure
        run: cmake --preset release -DAHA_PORTABLE_LINUX=ON
      - name: Build
        run: |
          cmake --build --preset release --parallel 2 2>&1 | tee build/release/build.log
      - name: Test without the LAN engine
        run: ctest --preset release
      - name: Package
        working-directory: build/release
        run: cpack -G TGZ 2>&1 | tee package.log
      - name: Verify portable package on Ubuntu 24.04 without Qt
        run: |
          docker run --rm \
            -v "$PWD:/source:ro" ubuntu:24.04 bash -ec '
              test -z "$(dpkg-query -W "libqt6*" 2>/dev/null)"
              bash /source/packaging/test-linux-package.sh /source/build/release/aha-flow-*-ubuntu24.04-x86_64.tar.gz /source/build/release/tests/aha_runtime_probe
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth pulseaudio pulseaudio-utils
              pulseaudio --start --exit-idle-time=-1 --load="module-native-protocol-unix socket=/tmp/aha-flow-pulse.sock auth-anonymous=1"
              export PULSE_SERVER=unix:/tmp/aha-flow-pulse.sock
              pactl load-module module-null-sink sink_name=aha_test
              pactl set-default-source aha_test.monitor
              export AHA_TEST_AUDIO=1
              bash /source/packaging/test-linux-package.sh /source/build/release/aha-flow-*-ubuntu24.04-x86_64.tar.gz /source/build/release/tests/aha_runtime_probe
            ' 2>&1 | tee build/release/package-test.log
      - name: Upload Linux verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-flow-linux-verification
          path: |
            build/release/*.log
            build/release/tests/aha_runtime_probe
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: aha-flow-linux-x64
          path: build/release/aha-flow-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.0
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          # Qt SVG is included in the desktop base archives, not an optional aqt module.
          modules: qtmultimedia qtwebsockets
          cache: true
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        id: windows-build
        run: cmake --build build/windows --config Release --parallel 2
      - name: Test without the LAN engine
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Check native Windows fonts and DPI
        if: always() && steps.windows-build.outcome == 'success'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_LOGGING_RULES = 'qt.qpa.fonts.debug=true'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $failedChecks = 0
          foreach ($scale in @('1', '1.25', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            $directory = Join-Path $env:GITHUB_WORKSPACE "build/windows/ui-screenshots/$scale"
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $env:AHA_FLOW_SCREENSHOT_DIR = $directory
            $arguments = @('fontsSurviveStylingAndDpi', 'compactSettingsAndTranscript', 'settingsFollowContentAndKeepFooterVisible', 'keyboardSettingsAndLongFields', '-o', "`"$directory/test-results.txt,txt`"")
            $process = Start-Process ./build/windows/Release/aha_ui_tests.exe -ArgumentList $arguments -NoNewWindow -PassThru -RedirectStandardError "$directory/font-engine.log"
            if (-not $process.WaitForExit(40000)) {
              Stop-Process -Id $process.Id -Force
              Add-Content "$directory/test-results.txt" 'Native UI test timed out after 40 seconds.'
              $failedChecks += 1
            } else {
              $process.WaitForExit()
              if ($process.ExitCode -eq 0) { continue }
              Get-Content "$directory/test-results.txt"
              $failedChecks += 1
            }
          }
          if ($failedChecks -gt 0) { throw "$failedChecks native Windows UI checks failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aha-flow-windows-ui-checks
          path: |
            build/windows/ui-screenshots/
            build/windows/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Package with Qt runtime
        working-directory: build/windows
        run: cpack -C Release -G ZIP
      - uses: actions/upload-artifact@v4
        with:
          name: aha-flow-windows-x64
          path: build/windows/aha-flow-*.zip
          if-no-files-found: error
